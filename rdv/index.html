    try { localStorage.setItem(CONSENT_KEY, JSON.stringify({ v: POLICY_VERSION, ts: Date.now(), analytics: !!analytics, ads: !!ads })); } catch (e) {}
  }

  var gtmLoaded = false;
  function applyChoice(c) {
    gtag('consent', 'update', {
      analytics_storage: c.analytics ? 'granted' : 'denied',
      ad_storage: c.ads ? 'granted' : 'denied',
      ad_user_data: c.ads ? 'granted' : 'denied',
      ad_personalization: c.ads ? 'granted' : 'denied'
    });
    // `_fbc` reposé ICI, entre l'accord et le chargement de GTM : le Pixel le lit
    // à son initialisation et l'attache à PageView, puis à tous les événements de
    // la page. Sous l'accord publicitaire seulement — c'est un cookie de publicité,
    // et le Pixel navigateur reste bloqué sans consentement (l'envoi serveur, lui,
    // part inconditionnellement : asymétrie assumée, décision du 2026-08-21).
    if (c.ads) window.h3cPoserFbc();
    garderContact(c.analytics);
    // PostHog avant la file d'événements de page : ils lui parviennent aussi.
    posthogActiver(c.analytics);
    // Les événements de page partent APRÈS la mise à jour du consentement et AVANT
    // le chargement de GTM : la file rejouée est alors consent:default →
    // consent:update → view_content/purchase → gtm.js. Les balises sont évaluées
    // sur l'état réel.
    flushPageEvents();
    if ((c.analytics || c.ads) && !gtmLoaded) {
      gtmLoaded = true;
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var s = document.createElement('script'); s.async = true;
      s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
      document.head.appendChild(s);
    }
  }

  // --- Bannière CNIL : refuser aussi simple qu'accepter, choix révocable (bouton Cookies) ---
  var STYLE = '#h3c-cmp{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;background:#fff;border-top:1px solid #e4ddd4;box-shadow:0 -4px 24px rgba(0,0,0,.12);padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}#h3c-cmp .h3c-cmp-in{max-width:760px;margin:0 auto;}#h3c-cmp p{margin:0 0 10px;font-size:.86rem;line-height:1.5;color:#4a4a4a;}#h3c-cmp a{color:#A8432B;text-decoration:underline;}#h3c-cmp .h3c-cmp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}#h3c-cmp button{font:inherit;font-size:.85rem;font-weight:600;border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid #cbb6a6;background:#fff;color:#333;}#h3c-cmp #h3c-accept{margin-left:auto;}#h3c-cmp .h3c-ok{background:#A8432B;border-color:#A8432B;color:#fff;}#h3c-cmp label{font-size:.82rem;color:#4a4a4a;margin-right:10px;display:inline-flex;align-items:center;gap:5px;}#h3c-cmp .h3c-cats{display:none;margin:6px 0 4px;}#h3c-cmp .h3c-cats.on{display:block;}#h3c-reopen{position:fixed;left:10px;bottom:10px;z-index:2147482999;font-size:.72rem;background:rgba(255,255,255,.92);border:1px solid #e4ddd4;border-radius:8px;padding:4px 9px;cursor:pointer;color:#6a6a6a;font-family:system-ui,sans-serif;}';

  function addReopen() {
    if (document.getElementById('h3c-reopen')) return;
    var r = document.createElement('button');
    r.id = 'h3c-reopen'; r.type = 'button'; r.textContent = 'Cookies';
    r.setAttribute('aria-label', 'Gérer mes cookies');
    r.addEventListener('click', showBanner);
    document.body.appendChild(r);
  }
  function removeBanner() { var b = document.getElementById('h3c-cmp'); if (b) b.remove(); addReopen(); }
  function showBanner() {
    if (document.getElementById('h3c-cmp')) return;
    if (!document.getElementById('h3c-cmp-style')) {
      var st = document.createElement('style'); st.id = 'h3c-cmp-style'; st.textContent = STYLE;
      document.head.appendChild(st);
    }
    var w = document.createElement('div');
    w.id = 'h3c-cmp'; w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', 'Consentement cookies');
    // Cases jamais cochées d'office (CNIL, art. 82 ; CJUE Planet49) : rouvert par « Cookies »,
    // le bandeau montre le choix déjà enregistré, sinon tout est décoché.
    var cur = readChoice();
    w.innerHTML =
      '<div class="h3c-cmp-in">' +
      '<p>Avec votre accord, ce site utilise des cookies de mesure d\'audience (Google Analytics, PostHog) et de publicité (Meta, Google Ads) pour comprendre ce qui vous aide vraiment. Sans action de votre part, aucun de ces cookies n\'est déposé. <a href="' + PRIVACY_URL + '">En savoir plus</a>.</p>' +
      '<div class="h3c-cats" id="h3c-cats">' +
      '<label><input type="checkbox" id="h3c-cat-analytics"' + (cur && cur.analytics ? ' checked' : '') + '> Mesure d\'audience</label>' +
      '<label><input type="checkbox" id="h3c-cat-ads"' + (cur && cur.ads ? ' checked' : '') + '> Publicité et réseaux sociaux</label>' +
      '</div>' +
      '<div class="h3c-cmp-row">' +
      '<button type="button" id="h3c-refuse">Continuer sans accepter</button>' +
      '<button type="button" id="h3c-custom">Personnaliser</button>' +
      '<button type="button" class="h3c-ok" id="h3c-accept">Tout accepter</button>' +
      '</div></div>';
    document.body.appendChild(w);
    document.getElementById('h3c-accept').addEventListener('click', function () {
      var custom = document.getElementById('h3c-cats').classList.contains('on');
      var an = custom ? document.getElementById('h3c-cat-analytics').checked : true;
      var ad = custom ? document.getElementById('h3c-cat-ads').checked : true;
      saveChoice(an, ad); applyChoice({ analytics: an, ads: ad }); removeBanner();
    });
    document.getElementById('h3c-refuse').addEventListener('click', function () {
      saveChoice(false, false); applyChoice({ analytics: false, ads: false }); removeBanner();
    });
    document.getElementById('h3c-custom').addEventListener('click', function () {
      document.getElementById('h3c-cats').classList.add('on');
      document.getElementById('h3c-accept').textContent = 'Valider mes choix';
    });
  }
  window.h3cConsent = { open: showBanner, status: readChoice };

  function boot() {
    var c = readChoice();
    if (c) { applyChoice(c); addReopen(); } else { showBanner(); }
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script>
